<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page">
    <header class="topbar">
        <div>
            <h1 th:text="${pageTitle}"></h1>
        </div>
        <nav class="topbar-nav">
            <a th:href="@{/admin/events}">イベント一覧へ戻る</a>
        </nav>
    </header>

    <section class="card">
        <form th:action="@{${formAction}}" th:object="${eventForm}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>開催日
                <input type="date" th:field="*{eventDate}">
                <span class="field-error" th:errors="*{eventDate}"></span>
            </label>
            <label>開始時間
                <input type="time" th:field="*{startTime}">
                <span class="field-error" th:errors="*{startTime}"></span>
            </label>
            <label>終了時間
                <input type="time" th:field="*{endTime}">
                <span class="field-error" th:errors="*{endTime}"></span>
            </label>
            <label>場所
                <input type="text" th:field="*{place}">
                <span class="field-error" th:errors="*{place}"></span>
            </label>
            <label>定員
                <input type="number" min="1" max="200" th:field="*{capacity}">
                <span class="field-error" th:errors="*{capacity}"></span>
            </label>
            <label class="full-width">備考
                <textarea rows="4" th:field="*{description}"></textarea>
                <span class="field-error" th:errors="*{description}"></span>
            </label>
            <span class="field-error full-width" th:errors="*{timeRangeValid}"></span>
            <div class="full-width form-actions">
                <button class="button" type="submit">保存</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
