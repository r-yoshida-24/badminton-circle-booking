<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント管理</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page">
    <header class="topbar">
        <div>
            <h1>イベント管理</h1>
            <p>イベントの登録・編集・削除を行います。</p>
        </div>
        <nav class="topbar-nav">
            <a th:href="@{/attendance}">利用者画面</a>
            <a th:href="@{/admin/members}">会員一覧</a>
            <a class="button" th:href="@{/admin/events/new}">新規登録</a>
        </nav>
    </header>

    <p th:if="${successMessage}" class="message success" th:text="${successMessage}"></p>

    <section class="card">
        <table class="table">
            <thead>
            <tr>
                <th>開催日</th>
                <th>時間</th>
                <th>場所</th>
                <th>定員</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${#temporals.format(event.eventDate, 'yyyy/MM/dd')}"></td>
                <td th:text="${#temporals.format(event.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(event.endTime, 'HH:mm')}"></td>
                <td th:text="${event.place}"></td>
                <td th:text="${event.capacity}"></td>
                <td class="table-actions">
                    <a th:href="@{|/admin/events/${event.id}/participants|}">参加者</a>
                    <a th:href="@{|/admin/events/${event.id}/edit|}">編集</a>
                    <form th:action="@{|/admin/events/${event.id}/delete|}" method="post" onsubmit="return confirm('削除しますか？');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="link-button danger" type="submit">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
