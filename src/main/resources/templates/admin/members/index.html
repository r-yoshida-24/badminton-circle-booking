<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員一覧</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page">
    <header class="topbar">
        <div>
            <h1>会員一覧</h1>
        </div>
        <nav class="topbar-nav">
            <a th:href="@{/admin/events}">イベント一覧へ戻る</a>
        </nav>
    </header>
    <section class="card">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>表示名</th>
                <th>LINE user ID</th>
                <th>権限</th>
                <th>状態</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.id}"></td>
                <td th:text="${member.displayName}"></td>
                <td th:text="${member.lineUserId}"></td>
                <td th:text="${member.role}"></td>
                <td th:text="${member.enabled ? '有効' : '無効'}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
