<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出欠確認</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page">
    <header class="topbar">
        <div>
            <h1>出欠確認</h1>
            <p th:text="|こんにちは、${currentMember.displayName ?: currentMember.lineUserId} さん|"></p>
        </div>
        <nav class="topbar-nav">
            <a th:href="@{/mypage}">マイページ</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/events}">管理画面</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="button secondary" type="submit">ログアウト</button>
            </form>
        </nav>
    </header>

    <p th:if="${successMessage}" class="message success" th:text="${successMessage}"></p>
    <p th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></p>

    <section th:if="${#lists.isEmpty(attendanceEvents)}" class="card">
        <p>今後のイベントはまだ登録されていません。</p>
    </section>

    <section th:each="event : ${attendanceEvents}" class="card event-card">
        <div class="event-header">
            <div>
                <h2 th:text="${#temporals.format(event.eventDate, 'M/d')} + ' ' + ${event.place}"></h2>
                <p th:text="${#temporals.format(event.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(event.endTime, 'HH:mm')}"></p>
                <p th:if="${event.description}" th:text="${event.description}"></p>
            </div>
            <div class="status-chip" th:text="${event.myStatus}"></div>
        </div>
        <form th:action="@{|/attendance/${event.eventId}|}" method="post" class="attendance-actions">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="button" type="submit" name="status" value="ATTENDING" th:classappend="${event.myStatus.name() == 'ATTENDING'} ? ' active'">参加</button>
            <button class="button" type="submit" name="status" value="ABSENT" th:classappend="${event.myStatus.name() == 'ABSENT'} ? ' active'">不参加</button>
            <button class="button" type="submit" name="status" value="UNDECIDED" th:classappend="${event.myStatus.name() == 'UNDECIDED'} ? ' active'">未定</button>
        </form>
        <div class="counts">
            <span>参加：<strong th:text="${event.counts.attendingCount}"></strong>人</span>
            <span>不参加：<strong th:text="${event.counts.absentCount}"></strong>人</span>
            <span>未定：<strong th:text="${event.counts.undecidedCount}"></strong>人</span>
            <span>定員：<strong th:text="${event.capacity}"></strong>人</span>
        </div>
    </section>
</div>
</body>
</html>
