<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラー</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page auth-page">
    <div class="card">
        <h1>エラーが発生しました</h1>
        <p th:text="${message}"></p>
        <p th:if="${path}">対象: <span th:text="${path}"></span></p>
        <a class="button" th:href="@{/}">トップへ戻る</a>
    </div>
</div>
</body>
</html>
