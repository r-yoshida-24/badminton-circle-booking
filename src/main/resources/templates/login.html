<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン | バドミントンサークル予約</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #dbe3ef;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                   "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      padding: 28px 24px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 1.4rem;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 14px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.88rem;
    }

    .link:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .error {
      margin: 0 0 12px;
      color: var(--danger);
      font-size: 0.88rem;
      text-align: center;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1 class="title">バドミントンサークル予約</h1>
    <p class="subtitle">ログインして予約状況を確認</p>

    <!-- 認証エラー表示例 -->
    <!-- <p class="error">メールアドレスまたはパスワードが正しくありません。</p> -->

    <form action="/login" method="post">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input
          id="email"
          name="email"
          type="email"
          class="input"
          placeholder="example@mail.com"
          required
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input
          id="password"
          name="password"
          type="password"
          class="input"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" name="rememberMe" />
          ログイン状態を保持する
        </label>
        <a href="/forgot-password" class="link">パスワードを忘れた場合</a>
      </div>

      <button type="submit" class="btn">ログイン</button>
    </form>

    <p class="footer">
      アカウントをお持ちでない方は管理者へ連絡してください
    </p>
  </main>
</body>
</html>
