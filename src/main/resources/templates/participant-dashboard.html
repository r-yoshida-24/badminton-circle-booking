<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参加者ダッシュボード | バドミントンサークル予約</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
      --ok: #16a34a;
      --wait: #d97706;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                   "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    .badge.ok { background: var(--ok); }
    .badge.wait { background: var(--wait); }

    ul {
      margin: 0;
      padding-left: 1.2rem;
    }

    li {
      margin: 8px 0;
      line-height: 1.5;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: white;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-outline:hover {
      background: #eff6ff;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>参加者ダッシュボード</h1>
      <p>参加予定イベントとキャンセル待ち状況を確認できます。</p>
    </header>

    <section class="card">
      <h2>参加予定 <span class="badge ok">確定</span></h2>
      <ul>
        <li>2026/09/20 19:00 - 市民体育館A（初級〜中級）</li>
        <li>2026/09/27 18:00 - 北区スポーツセンター（中級）</li>
      </ul>
    </section>

    <section class="card">
      <h2>キャンセル待ち <span class="badge wait">待機中</span></h2>
      <ul>
        <li>2026/10/04 19:00 - 南体育館（中級） / 順位: 2番目</li>
      </ul>
    </section>

    <section class="card">
      <h2>メニュー</h2>
      <div class="actions">
        <a href="/events" class="btn btn-primary">イベント一覧へ</a>
        <a href="/mypage" class="btn btn-outline">マイページ</a>
      </div>
    </section>
  </main>
</body>
</html>
