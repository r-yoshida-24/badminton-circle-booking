spring.application.name=badminton-circle-booking
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/badminton_booking_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=badminton-circle-booking-secret-key-12345
jwt.expiration=86400000
logging.level.root=INFO
logging.level.com.badminton=DEBUG